<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>놀이마당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 윷판이 그려진 마당 위에 놀이 도구가 흩어져 놓여 있고, 시작·마당·설명·놀이가 같은 바닥 위에서 바뀐다 카드 없음 — 도구 그림 자체가 메뉴 */
:root{
  --bg:#F3EDE2;          /* 미색 */
  --bg-2:#EAE1D1;
  --ink:#2A2826;         /* 먹색 */
  --ink-soft:#655D53;
  --line:rgba(42,40,38,.15);
  --jjok:#2E4A6B;        /* 쪽빛 */
  --dahong:#C8473A;      /* 다홍 */
  --chija:#E2B23C;       /* 치자색 */
  --cheong:#3F7F6E;      /* 청록 */
  --on-accent:#FFF9F0;
  --shadow:rgba(60,40,20,.30);
  --veil:rgba(243,237,226,.86);
  --f-display:"Song Myung","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161D27; --bg-2:#1E2734; --ink:#EEE6D7; --ink-soft:#B2A998; --line:rgba(238,230,215,.13);
    --jjok:#86A6CD; --dahong:#E46C5D; --chija:#EBC45E; --cheong:#74B5A2; --on-accent:#1A120E;
    --shadow:rgba(0,0,0,.55); --veil:rgba(22,29,39,.86); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161D27; --bg-2:#1E2734; --ink:#EEE6D7; --ink-soft:#B2A998; --line:rgba(238,230,215,.13);
  --jjok:#86A6CD; --dahong:#E46C5D; --chija:#EBC45E; --cheong:#74B5A2; --on-accent:#1A120E;
  --shadow:rgba(0,0,0,.55); --veil:rgba(22,29,39,.86); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--dahong);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
.view{min-height:100%}
svg{overflow:visible}

/* ───────── 시작 화면 ───────── */
#intro{position:fixed;inset:0;overflow:hidden;cursor:pointer;background:var(--bg);touch-action:none}
.intro-field{position:absolute;inset:0}
.piece{position:absolute;width:var(--s);height:var(--s);left:var(--x);top:var(--y);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);transform:rotate(var(--r));pointer-events:none}
.bob{position:relative;width:100%;height:100%;perspective:700px;animation:bob var(--d,6s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tilt{position:relative;width:100%;height:100%}
.tilt svg{display:block;width:100%;height:100%}
.shade{display:none}
.intro-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:min(92vw,620px);display:flex;flex-direction:column;align-items:center;gap:10px}
.eyebrow{font-family:var(--f-ui);font-size:13px;letter-spacing:.18em;color:var(--dahong)}
.intro-title h1{font-family:var(--f-display);font-size:clamp(68px,13vw,176px);line-height:.95;letter-spacing:.04em}
.intro-sub{font-size:clamp(16px,2vw,20px);color:var(--ink-soft)}
.hint{margin-top:18px;font-family:var(--f-ui);font-size:13px;color:var(--ink-soft);letter-spacing:.04em;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.burst{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid var(--dahong);pointer-events:none;z-index:50}
.curtain{position:fixed;inset:0;background:var(--bg);z-index:40;pointer-events:none}

/* ───────── 마당 ───────── */
#yard{display:flex;flex-direction:column;min-height:100%}
.yard-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:10px 32px;padding:14px clamp(16px,4vw,48px);background:var(--veil);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{font-family:var(--f-display);font-size:28px;line-height:1}
.cats{display:flex;gap:2px;flex-wrap:wrap}
.cat{position:relative;padding:8px 14px;font-family:var(--f-ui);font-size:14px;color:var(--ink-soft);transition:color .2s}
.cat::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;background:var(--dahong);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.cat:hover{color:var(--ink)}
.cat[aria-selected="true"]{color:var(--ink)}
.cat[aria-selected="true"]::after{transform:scaleX(1)}
.cat-intro{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:1240px;width:100%;margin:0 auto;padding:clamp(40px,10vh,110px) clamp(16px,4vw,48px) clamp(20px,6vh,60px)}
.cat-intro h2{font-family:var(--f-display);font-size:clamp(48px,8vw,112px);line-height:1}
.cat-intro p{color:var(--ink-soft);max-width:30em;font-size:clamp(17px,1.7vw,20px)}
.cat-intro .count{font-family:var(--f-ui);font-size:13px;font-variant-numeric:tabular-nums}
.scroll-hint{margin-top:22px;font-family:var(--f-ui);font-size:13px!important;letter-spacing:.04em}
.scroll-hint span{display:inline-block;margin-left:6px;color:var(--dahong);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
.board-pattern{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.5;will-change:transform}
#yard > *:not(.board-pattern){position:relative;z-index:1}
#yard .yard-head{position:sticky;z-index:10}
.yard-body{display:grid;grid-template-columns:150px minmax(0,1fr);gap:clamp(24px,4vw,64px);max-width:1240px;width:100%;margin:0 auto;padding:0 clamp(16px,4vw,48px) 40px}
.rail{position:sticky;top:110px;align-self:start;display:flex;flex-direction:column;gap:4px;padding-top:24px}
.rail button{display:flex;align-items:center;gap:10px;padding:5px 0;font-family:var(--f-ui);font-size:14px;color:var(--ink-soft);text-align:left;transition:color .25s}
.rail button::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;transition:background .25s,box-shadow .25s,transform .25s}
.rail button:hover{color:var(--ink)}
.rail button.on{color:var(--ink);font-weight:600}
.rail button.on::before{background:var(--dahong);box-shadow:none;transform:scale(1.2)}
.rail i{width:5px;height:5px;border-radius:50%;background:var(--dahong);margin-left:-4px;transform:translateY(-6px)}
.rows{min-width:0}
.yr{min-height:min(80vh,720px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(24px,5vw,72px);padding-block:48px}
.yr{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr)}.yr:nth-child(even){grid-template-columns:minmax(0,1.14fr) minmax(0,.86fr)}
.yr:nth-child(even) .yr-fig{order:2}
.yr-fig{display:flex;justify-content:center;min-width:0}
.yr-obj{width:min(100%,380px);aspect-ratio:1;transform:translateY(calc(var(--p,0) * -46px)) rotate(calc(var(--p,0) * 7deg))}
.yr:nth-child(even) .yr-obj{transform:translateY(calc(var(--p,0) * -46px)) rotate(calc(var(--p,0) * -7deg))}
.yr-obj-in{position:relative;display:block;width:100%;height:100%;perspective:800px;border-radius:50%}
.yr-obj-in .shade{bottom:0}
.yr-obj-in:hover .tilt svg{transform:scale(1.04)}
.yr-obj-in .tilt svg{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.yr-text{min-width:0;display:flex;flex-direction:column;gap:14px}
.yr-text .eyebrow b{font-weight:600}
.yr-text h3{font-family:var(--f-display);font-size:clamp(42px,5.6vw,76px);line-height:1.05}
.yr-text .lead{margin:0;font-size:clamp(16px,1.45vw,18px);max-width:none;word-break:keep-all}
.yr-text .cta{margin-top:6px}
.yr-next{min-height:46vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.next-cat{font-family:var(--f-display);font-size:clamp(28px,4vw,48px);color:var(--ink);padding:8px 4px;border-bottom:2px solid var(--dahong)}
.next-cat b{font-weight:400;color:var(--dahong)}
/* 스크롤 등장 */
#yard.reveal .yr .yr-obj-in{opacity:0;transform:translateY(70px) rotate(-16deg) scale(.82);transition:opacity .8s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
#yard.reveal .yr:nth-child(even) .yr-obj-in{transform:translateY(70px) rotate(16deg) scale(.82)}
#yard.reveal .yr .yr-text > *{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
#yard.reveal .yr .yr-text > :nth-child(2){transition-delay:.08s}
#yard.reveal .yr .yr-text > :nth-child(3){transition-delay:.16s}
#yard.reveal .yr .yr-text > :nth-child(4){transition-delay:.24s}
#yard.reveal .yr.in .yr-obj-in,#yard.reveal .yr.in .yr-text > *{opacity:1;transform:none}
#yard.reveal .yr-next{opacity:0;transform:translateY(30px);transition:opacity .7s,transform .8s}
#yard.reveal .yr-next.in{opacity:1;transform:none}
@media (max-width:860px){
  .yard-body{grid-template-columns:1fr}
  .rail{display:none}
  .yr,.yr:nth-child(even){grid-template-columns:1fr;min-height:0;gap:18px;padding-block:36px}
  .yr:nth-child(even) .yr-fig{order:0}
  .yr-obj{width:min(64vw,280px)}
  .yr-text{align-items:flex-start}
}
@media (prefers-reduced-motion: reduce){ .scroll-hint span{animation:none} .yr-obj{transform:none!important} }
/* ───────── 설명 ───────── */
#detail{padding-bottom:72px}
.d-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,4vw,48px);background:var(--veil);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.link{font-family:var(--f-ui);font-size:14px;color:var(--ink-soft);padding:6px 2px;transition:color .2s}
.link:hover{color:var(--ink)}
.d-nav{display:flex;gap:18px}
.d-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,88px);max-width:1280px;margin:0 auto;padding:12px clamp(16px,5vw,72px) 0;align-items:start}
.d-fig{position:sticky;top:96px;margin:0;width:100%;aspect-ratio:1;max-width:520px;justify-self:center}
.d-fig .shade{bottom:2%}
.d-text{min-width:0;padding-top:clamp(0px,4vw,48px)}
.d-text .eyebrow{margin-bottom:12px}
.d-text h2{font-family:var(--f-display);font-size:clamp(48px,7.4vw,96px);line-height:1.02;letter-spacing:.01em}
.hanja{font-family:"Nanum Myeongjo","Batang",serif;font-size:.36em;color:var(--ink-soft);margin-left:.35em;letter-spacing:.1em;vertical-align:.4em}
.lead{margin-top:20px;font-size:clamp(18px,1.8vw,21px);line-height:1.65;max-width:32em}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:999px;font-family:var(--f-ui);font-weight:600;font-size:15px;transition:transform .2s,background .2s}
.btn.primary{background:var(--dahong);color:var(--on-accent)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.round{position:relative;width:104px;height:104px;padding:0;border-radius:50%;flex-direction:column;justify-content:center;gap:4px;font-size:15px!important;background:var(--dahong);color:var(--on-accent);font-size:13.5px;line-height:1.25;text-align:center;box-shadow:0 8px 20px -8px var(--dahong)}
.btn.round svg{width:22px;height:22px;fill:currentColor;margin-left:3px}
.btn.round::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px dashed var(--dahong);opacity:.55;animation:spinring 14s linear infinite}
.btn.round:hover{transform:scale(1.06)}
@keyframes spinring{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.btn.round::after{animation:none}}
.yr-text .cta{align-items:center;gap:14px 22px}
.btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink-soft)}
.cta small{font-family:var(--f-ui);font-size:13px;color:var(--ink-soft)}
.d-sec{margin-top:44px;max-width:34em}
.d-sec h3{font-family:var(--f-ui);font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--dahong);margin-bottom:10px}
.d-sec p{line-height:1.85}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;counter-increment:s;line-height:1.75}
.steps li::before{content:counter(s);font-family:var(--f-display);font-size:24px;line-height:1.1;color:var(--jjok)}
.d-sec.how{max-width:none}
.howpics{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:24px 20px;margin-top:6px}
.hp{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.hp svg{display:block;width:100%;height:auto;aspect-ratio:4/3}
.hp figcaption{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;font-size:15px;line-height:1.6}
.hp figcaption b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1;color:var(--jjok)}
.ovpics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:min(100%,680px);text-align:left}
.ovpics .hp figcaption{font-size:14px;color:var(--ink)}
@media (max-width:560px){.ovpics{grid-template-columns:1fr;max-width:300px}.ovpics .hp svg{max-height:120px}}
.d-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px 40px;margin-top:44px;max-width:34em}
.d-meta .d-sec{margin-top:0}

/* ───────── 놀이 ───────── */
#play{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:20}
.play-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:calc(10px + env(safe-area-inset-top,0px)) clamp(16px,3vw,32px) 10px}
.play-title{font-family:var(--f-display);font-size:26px;line-height:1.2}
.hud{display:flex;flex-wrap:wrap;gap:4px 18px;margin-left:auto;font-family:var(--f-ui);font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.hud b{color:var(--ink);font-weight:600}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;margin:0 clamp(8px,2vw,24px) calc(clamp(8px,2vw,24px) + env(safe-area-inset-bottom,0px));border-radius:20px;background:var(--bg-2);user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;display:block;touch-action:none}
.stage{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.ov{touch-action:pan-y}
@media (max-width:600px){.play-head{gap:2px 12px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}.play-title{font-size:20px}#sndBtn{margin-left:auto}.hud{order:3;width:100%;margin-left:0;font-size:12.5px;gap:2px 12px}.ov{justify-content:flex-start}.ov h2{font-size:36px}}
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;background:var(--veil);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);overflow:auto}
.ov h2{font-family:var(--f-display);font-size:clamp(40px,6vw,64px);line-height:1.1}
.ov p{max-width:30em;color:var(--ink-soft)}
.ov .big{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);color:var(--ink)}
.ov .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
kbd{font-family:var(--f-ui);font-size:12px;padding:2px 7px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line),0 1px 0 var(--line);color:var(--ink)}

/* 윷놀이 */
.yut{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px);gap:16px 28px;padding:20px clamp(12px,2vw,28px);overflow:auto}
.yut-bw{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.yut-board{display:block;width:100%;height:auto;max-width:680px}
.yut-side{display:flex;flex-direction:column;justify-content:center;gap:26px;min-width:0}
.yt{display:flex;flex-direction:column;gap:8px}
.yt-name{font-family:var(--f-display);font-size:22px;display:flex;align-items:center;gap:10px}
.yt-name i{width:14px;height:14px;border-radius:50%;display:inline-block}
.yt-turn{font-family:var(--f-ui);font-size:12px;color:var(--dahong);letter-spacing:.06em}
.tray{display:flex;gap:8px;min-height:34px;align-items:center;flex-wrap:wrap}
.tray .tk{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .2s}
.tray .tk.home{opacity:.28}
.tray button.tk.go{animation:pulse 1.1s ease-in-out infinite}
.tray button.tk.go:hover{transform:scale(1.15)}
@keyframes pulse{50%{transform:scale(1.14)}}
.throw{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.sticks{display:flex;gap:12px;height:132px;align-items:center}
.stick{width:24px;height:120px;border-radius:12px;position:relative;overflow:hidden}
.stick.flat{background:#EBCB98}
.stick.round{background:linear-gradient(90deg,#7E4F28,#B47F4B 45%,#8A5A31)}
.stick svg{position:absolute;inset:0;width:100%;height:100%}
.sticks.toss .stick{animation:toss .75s cubic-bezier(.3,.7,.4,1)}
.sticks.toss .stick:nth-child(2){animation-delay:.04s}.sticks.toss .stick:nth-child(3){animation-delay:.08s}.sticks.toss .stick:nth-child(4){animation-delay:.12s}
@keyframes toss{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-60px) rotate(200deg)}75%{transform:translateY(4px) rotate(352deg)}100%{transform:translateY(0) rotate(360deg)}}
.yres{font-family:var(--f-display);font-size:34px;line-height:1.1;min-height:38px}
.yres small{font-family:var(--f-body);font-size:15px;color:var(--ink-soft);margin-left:8px}
.pend{display:flex;gap:8px;flex-wrap:wrap;min-height:34px}
.chip{padding:4px 14px;border-radius:999px;font-family:var(--f-display);font-size:18px;box-shadow:inset 0 0 0 1.5px var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.ymsg{font-family:var(--f-ui);font-size:14px;color:var(--ink-soft);min-height:22px}
.yut-board .pc{transition:transform .17s cubic-bezier(.3,.7,.4,1);cursor:default}
.yut-board .pc.go{cursor:pointer}
.yut-board .pc.go .ring{animation:ring 1.1s ease-in-out infinite}
@keyframes ring{50%{stroke-width:7}}
@media (max-width:820px){
  .yut{display:flex;flex-direction:column;gap:14px;padding:12px}
  .yut-bw{flex:none;order:-1}
  .yut-board{max-width:min(100%,520px)}
  .yut-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 16px;justify-content:stretch}
  .yt[data-t="0"]{grid-row:1;grid-column:1}.yt[data-t="1"]{grid-row:1;grid-column:2}
  .throw{grid-column:1 / -1;grid-row:2}
  .yt-name{font-size:19px}.tray .tk{width:24px;height:24px}
  .sticks{height:80px;gap:10px}.stick{height:70px;width:18px}
  .yres{font-size:28px}
}

/* 손이 정해진 높이에 오도록 위팔 각도를 찾음 (아래팔은 굽힘 고정) */
const solveArm = (yaw, k, b, ty, fa, lo=-175, hi=-5) => { let best = null;
  for(let ua = lo; ua <= hi; ua += .5){ const [x, y] = handAt(yaw, k, ua, fa, b); const e = Math.abs(y - ty) + (x < 0 ? 99 : 0); if(!best || e < best.e) best = {e, ua, x, y}; }
  return best; };
const footDrop = (th, sh) => -21 + 9*Math.cos(th*Math.PI/180) + 9.9*Math.cos((th+sh)*Math.PI/180) + 2.1;

/* ── 줄다리기: 두 편이 몸을 뒤로 젖히고 버팀, 번갈아 당김 ── */
{
  const T = 1.6, S = .82, G = 148, RY = 122, yaw = 74, ty = -(G - RY)/S, FA = -22;
  const legs = {thn:-38, shn:10, thf:16, shf:24};
  const dy = -Math.max(footDrop(legs.thn, legs.shn), footDrop(legs.thf, legs.shf));
  const at = (b, extra={}) => { const n = solveArm(yaw, 'n', b, ty, FA), fr = solveArm(yaw, 'f', b, ty, FA);
    return Object.assign({r:`translate(0px,${f(dy)}px)`, b, uan:n.ua, fan:FA, uaf:fr.ua, faf:FA, sk:`rotate(${f(-b*.8)}deg)`}, legs, extra); };
  pose('jp', T, {
    '0%,100%': at(-24, {h:6, br:24, gr:20}),

    '75%': at(-27, {h:4, br:18, gr:14})
  }, {delay:'var(--jd,0s)'});
  const puller = (x, flip, o, dl) => `<g transform="translate(${x} ${G}) scale(${flip ? -S : S} ${S})"><g style="--jd:${dl}s">${fig(Object.assign({p:'jp', yaw, mouth:'grit', pose:at(-24, {h:6})}, o))}</g></g>`;

      const tuft=(x,d)=>`<path d="M${x} ${116}l${d*9} -4M${x} ${119}l${d*11} -1M${x} ${122}l${d*12} 1M${x} ${125}l${d*11} 3M${x} ${128}l${d*8} 5" stroke="#C9A24A" stroke-width="2" stroke-linecap="round"/>`;
      return `${r(4,32,RY)}</g><g class="jl-ext jl-er">${r(128,156,RY)}</g><g class="jl-tuft">${tuft(30,-1)}${tuft(130,1)}</g>${r(32,128,RY)}<path d="M77 ${RY}h6" stroke="${DD}" stroke-width="13"/>`;})()}</g>

}

/* ── 씨름: 다른 아이콘과 같은 인물 그림체 — 바지저고리에 상투 튼 두 장정이 샅바를 맞잡고 힘겨루기 ── */
{
  const T = 3.2, GY = 132, S = 1.26, yaw = 78, D2 = Math.PI/180;
  const rot = (x,y,a)=>{ a*=D2; return [x*Math.cos(a)-y*Math.sin(a), x*Math.sin(a)+y*Math.cos(a)]; };
  const SHx = k => (k==='n'?1:-1)*(7*Math.cos(yaw*D2) + .6);
  const bodyToFig = (st, p) => { const q = rot(p[0], p[1]+21, st.b); return [q[0] + st.dx, q[1] - 21 + st.dy]; };
  const figToBody = (st, p) => { const q = rot(p[0]-st.dx, p[1]-st.dy+21, -st.b); return [q[0], q[1]-21]; };
  const toScr = (st, p) => [st.x0 + st.dir*p[0]*S, GY + p[1]*S];
  const fromScr = (st, P) => [(P[0]-st.x0)/(st.dir*S), (P[1]-GY)/S];
  const L1 = 8.8, L2 = 10.4;
  const ik = (Sp, Tg) => { let dx = Tg[0]-Sp[0], dy = Tg[1]-Sp[1], d = Math.hypot(dx,dy); d = Math.min(d, L1+L2-.1);
    const a = Math.atan2(dy, dx), bb = Math.acos(Math.max(-1, Math.min(1, (L1*L1 + d*d - L2*L2)/(2*L1*d)))), a1 = a + bb;
    const E = [Sp[0]+L1*Math.cos(a1), Sp[1]+L1*Math.sin(a1)], a2 = Math.atan2(Tg[1]-E[1], Tg[0]-E[0]);
    return {ua: a1/D2 - 90, fa: (a2 - a1)/D2}; };
  const drop = (th, sh) => -21 + 9*Math.cos(th*D2) + 9.9*Math.cos((th+sh)*D2) + 2.1;
  const mk = (x0, dir) => (o={}) => { const st = Object.assign({x0, dir, dx:0, dy:0, b:56, h:-30, thn:-16, shn:22, thf:32, shf:4}, o);
    st.dy = (o.dy || 0) - Math.max(drop(st.thn, st.shn), drop(st.thf, st.shf)); return st; };
  const A = mk(57, 1), B = mk(103, -1);
  const frames = {
    '0%,100%': [A(), B()],
    '18%': [A({dx:2.4, b:62, thn:-22, shn:28, thf:38, shf:0}), B({dx:-2.4, b:50, thf:24, shf:10})],
    '36%': [A(), B()],
    '52%': [A({dx:-2.4, b:50, thf:24, shf:10}), B({dx:2.4, b:62, thn:-22, shn:28, thf:38, shf:0})],
    '66%': [A({b:50, dy:1.6, thn:-8, shn:30, thf:22, shf:24, h:-24}), B({b:58})],
    '76%': [A({b:40, dy:-1, thn:-10, shn:10, thf:20, shf:4, h:-20}), B({b:64, dy:-6, thn:-30, shn:50, thf:6, shf:44, h:-38})],
    '86%': [A({b:54}), B({b:54, dy:1})]
  };
  const KA = {}, KB = {};
  for(const [pct, [a, b]] of Object.entries(frames)){
    for(const [me, op, keys] of [[a, b, KA], [b, a, KB]]){
      const waist = toScr(op, bodyToFig(op, [-7.6, -27]));
      const thigh = (()=>{ const q = rot(0, 4, op.thn); return toScr(op, [3.5*Math.cos(yaw*D2) + q[0] + op.dx, -21 + q[1] + op.dy]); })();
      const n = ik([SHx('n'), -39.4], figToBody(me, fromScr(me, waist)));
      const fr = ik([SHx('f'), -39.4], figToBody(me, fromScr(me, thigh)));
      keys[pct] = {r:`translate(${f(me.dx)}px,${f(me.dy)}px)`, b:me.b, h:me.h, thn:me.thn, shn:me.shn, thf:me.thf, shf:me.shf, uan:f(n.ua), fan:f(n.fa), uaf:f(fr.ua), faf:f(fr.fa)};
    }
  }
  pose('ssA', T, KA); pose('ssB', T, KB);
  const man = (pre, K, o) => fig(Object.assign({p:pre, yaw, girl:false, sangtu:true, beard:true, hs:.8, mouth:'grit', cuff:'#F3EEE4', pose:K['0%,100%']}, o));
  KF('srDust', '0%,12%{opacity:0;transform:scale(.4)}20%{opacity:.6;transform:scale(1)}34%,100%{opacity:0;transform:scale(1.5) translateY(-3px)}');
  ON('.sr2-dust', `srDust ${T}s ease-out var(--sd) infinite`);
  PPL.rules.push('.sr2-dust{opacity:0;transform-box:fill-box;transform-origin:center}');
  const dust = (x, d) => `<g class="sr2-dust" style="--sd:${d}s"><circle cx="${x}" cy="${GY-1}" r="3" fill="#E3CFA4"/><circle cx="${x+5}" cy="${GY-3}" r="2.2" fill="#E8D8B6"/><circle cx="${x-4}" cy="${GY-2.4}" r="1.8" fill="#DCC492"/></g>`;
  ART.ssireum = `<ellipse cx="80" cy="134" rx="72" ry="17" fill="#D8BA86"/><ellipse cx="80" cy="131" rx="72" ry="17" fill="#E8D0A0"/><ellipse cx="80" cy="131" rx="64" ry="13" fill="none" stroke="#D2B47E" stroke-width="1.6" stroke-dasharray="2 5"/>
    <path d="M30 136c10 4 22 5 32 3M98 140c14 1 26-1 34-5" stroke="#CBAE7A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="80" cy="132" rx="38" ry="4" fill="#B8955E" opacity=".3"/>
    <g transform="translate(103 ${GY}) scale(${-S} ${S})">${man('ssB', KB, {top:'#8BB8D9', bot:'#E9E1CF', belt:JJ, thighBand:JJ, rib:JJ, git:JJ})}</g>
    <g transform="translate(57 ${GY}) scale(${S})">${man('ssA', KA, {top:'#F2EDE2', bot:'#E9E1CF', belt:DH, thighBand:DH, rib:DH, git:DH})}</g>
    ${dust(36, 0)}${dust(124, -T*0.48)}${dust(58, -T*0.1)}`;
}

/* ── 강강술래: 손잡고 둥글게 돌며 왼쪽으로 감 — 여덟 방향 모습이 자연스럽게 바뀜 ── */
{
  const G = {n:8, cx:80, cy:122, rx:60, ry:14, T:7}, Rd = Math.PI/180;
  const aOf = t => Math.PI/2 + t*2*Math.PI;
  const yawAt = t => { const a = aOf(t); return ((Math.atan2(-Math.cos(a), -Math.sin(a))/Rd) + 360) % 360; };
  const isFront = t => Math.sin(aOf(t)) > 0;
  const LAY = {b:[90,45,0,315,270], f:[270,225,180,135,90]};
  const N = 96;
  for(const [L, views] of Object.entries(LAY)) views.forEach(v => {
    let fr = '', prev = null;
    for(let k = 0; k <= N; k++){ const t = k/N, vv = Math.round(yawAt(t)/45)%8*45, on = (L==='f') === isFront(t) && vv === v ? 1 : 0;
      if(on !== prev || k === N){ fr += `${f(t*100)}%{visibility:${on ? 'visible' : 'hidden'}}`; prev = on; } }
    KF(`gv_${L}${v}`, fr); ON(`.gv-${L}${v}`, `gv_${L}${v} ${G.T}s step-end var(--gd) infinite`);
  });
  // 걸음: 아이마다 한 번만 움직이게 (여러 방향 그림을 감싼 바깥 묶음에 적용) — 관절마다 따로 돌리면 무거움
  KF('ggWalk', '0%,50%,100%{transform:translateY(0) skewX(0deg)}25%{transform:translateY(-1.8px) skewX(-2deg)}75%{transform:translateY(-1.8px) skewX(2deg)}');
  ON('.gg-w', 'ggWalk .7s ease-in-out var(--wd) infinite');
  PPL.rules.push('.gg-w{transform-box:fill-box;transform-origin:50% 100%}');
  const cols = [[DH,JJ],['#F0C24B',DH],[CG,'#F0C24B'],['#8BB8D9','#D46A8C'],[DH,CG],['#F0C24B',JJ],['#B48FCB',DH],[CG,'#F0C24B']];
  const kidView = (i, yaw) => { const [t, b] = cols[i], r = cols[(i+3)%8][0], c = Math.cos(yaw*Rd), sg = c >= 0 ? 1 : -1, ac = Math.abs(c);
    const side = ac < .5, out = 14 + 46*ac;
    const pose0 = side ? {uan:-26, fan:-20, uaf:-14, faf:-16} : {uan:-sg*out, fan:-sg*8, uaf:sg*out, faf:sg*8};
    return `<g transform="scale(.875)">${fig({p:'gx', yaw, top:t, bot:b, rib:r, git:cols[(i+5)%8][0], pose:pose0})}</g>`; };
  const items = [...Array(G.n)].map((_, i) => { const ph = i/G.n, a = aOf(ph); return {i, ph, x:G.cx + Math.cos(a)*G.rx, y:G.cy + Math.sin(a)*G.ry, s:.58 + .22*(Math.sin(a)+1)/2}; }).sort((a, b) => a.y - b.y);
  const layer = (L) => items.map(it => {
    const vis0 = (L==='f') === isFront(it.ph), v0 = Math.round(yawAt(it.ph)/45)%8*45;
    return `<g class="gg-p" style="--gd:${f(-it.ph*G.T)}s;--wd:${f(-it.i*.17)}s" transform="translate(${f(it.x)} ${f(it.y)}) scale(${f(it.s)})">`
      + `<g class="gg-w">` + LAY[L].map(v => `<g class="gv-${L}${v}" style="visibility:${vis0 && v === v0 ? 'visible' : 'hidden'}">${kidView(it.i, v)}</g>`).join('') + `</g></g>`; }).join('');
  ART.ganggang = `<circle cx="80" cy="44" r="32" fill="${CJ}"/><circle cx="80" cy="44" r="26" fill="${CL}"/><circle cx="70" cy="36" r="5" fill="${CJ}" opacity=".45"/><circle cx="91" cy="52" r="3.6" fill="${CJ}" opacity=".45"/><circle cx="88" cy="32" r="2.4" fill="${CJ}" opacity=".45"/>
    <ellipse cx="80" cy="124" rx="66" ry="16" fill="#3A332C" opacity=".08"/>
    ${layer('b')}<ellipse cx="80" cy="${f(G.cy - 31*.69)}" rx="60" ry="14" fill="none" stroke="#B9A48A" stroke-width="1.6" opacity=".45"/>${layer('f')}`;
}

  ON('.gm2-band', `gm2Band ${T}s ease-in-out ${D}s infinite`); ON('.gm2-band2', `gm2Band2 ${T}s ease-in-out ${D}s infinite`);

  ON('.gm2-sh', `gm2Sh ${T}s ease-in-out ${D}s infinite`);
  PPL.rules.push('.gm2-sh{transform-box:fill-box;transform-origin:center}');
  // 줄 잡은 아이: 박자에 맞춰 손뼉
  pose('gh', T/2, {'0%,100%': {uan:-62, fan:-70, uaf:-40, faf:-80, r:'translate(0px,0px)', h:-3}, '50%': {uan:-48, fan:-96, uaf:-30, faf:-100, r:'translate(0px,1.2px)', h:3}}, {delay:'var(--hd,0s)'});
  const holder = (x, flip, o, dl) => `<g transform="translate(${x} 133) scale(${flip ? -.78 : .78} .78)"><g style="--hd:${dl}s">${fig(Object.assign({p:'gh', yaw:55, pose:{uan:-62, fan:-70, uaf:-40, faf:-80}}, o))}</g></g>`;
  ART.gomu = `<ellipse cx="80" cy="134" rx="70" ry="5" fill="#000" opacity=".08"/>

    <path class="gm2-band2" d="M12 121Q80 121 148 121" stroke="#D49A2A" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;

/* ── 사방치기(위에서 본 모습): 칸마다 발을 맞춰 깡충, 팔과 댕기가 따라 움직임 ── */
{

  const kid = `<g class="sb-fl"><path d="M-3.4 -9L-2 -1" stroke="#F1E6D4" stroke-width="4.4" stroke-linecap="round"/><path d="M-3.6 -13.4c-2.6 0-3.4 2.6-3 4.6c.4 2 1.6 2.8 3 2.8s2.6-.8 2.8-2.8c.2-2-.4-4.6-2.8-4.6z" fill="${WH}" stroke="#DCD1BE" stroke-width=".6"/></g>
    <g class="sb-fr"><path d="M3.4 -9L2 -1" stroke="#F1E6D4" stroke-width="4.4" stroke-linecap="round"/><path d="M3.6 -13.4c2.6 0 3.4 2.6 3 4.6c-.4 2-1.6 2.8-3 2.8s-2.6-.8-2.8-2.8c-.2-2 .4-4.6 2.8-4.6z" fill="${WH}" stroke="#DCD1BE" stroke-width=".6"/></g>
    <g class="sb2-sk"><circle r="9.6" fill="#D46A8C"/>${[...Array(12)].map((_,i)=>{const a=i/12*Math.PI*2;return `<path d="M${f(Math.cos(a)*4)} ${f(Math.sin(a)*4)}L${f(Math.cos(a)*9.2)} ${f(Math.sin(a)*9.2)}" stroke="#000" stroke-opacity=".1" stroke-width="1"/>`;}).join('')}<circle r="9.6" fill="none" stroke="#B9506F" stroke-width="1.2"/></g>

    <ellipse cx="0" cy="-4.6" rx="4" ry="2" fill="${SKc}"/><circle cy="0" r="6.6" fill="${HR}"/><path d="M0 -6.4V5.6" stroke="${HRL}" stroke-width="1"/><path d="M-3.4 -4.2Q-1 -6.4 2 -5.4" stroke="${HRL}" stroke-width="1.2" fill="none" stroke-linecap="round"/>`;

/* ── 그 밖의 아이콘 다듬기 ── */
{
  // 공기: 손바닥 ↔ 손등 ↔ 주먹이 바뀔 때 손이 납작해졌다 펴지며 뒤집힘
  ART.gonggi = ART.gonggi.replace(/<g class="gk-palm">([\s\S]*?)<g class="gk-fist" opacity="0">([\s\S]*?)<\/g>/, (m) => `<g class="gk-flip">${m}</g>`);
  KF('gkFlip', '0%,8%{transform:none}13%{transform:scale(1.04,.22)}18%,53%{transform:none}58%{transform:scale(1.04,.22)}63%,64%{transform:none}69%{transform:scale(.9,.55)}74%,86%{transform:none}91%{transform:scale(1.04,.3)}96%,100%{transform:none}');

  ART.paengi = ART.paengi.replace('<path d="M124 46c-12 6-18 16-10 24s-2 18-14 18"', '<path class="pg-str" d="M124 46c-12 6-18 16-10 24s-2 18-14 18"').replace('<path d="M124 46c-6 10-6 18 2 26"', '<path class="pg-str2" d="M124 46c-6 10-6 18 2 26"');

  KF('pgStr2', `0%,100%{d:path('M124 46c-6 10-6 18 2 26')}30%{d:path('M124 46c2 -8 8 -12 16 -10')}46%{d:path('M124 46c-10 4 -18 10 -22 16')}64%,80%{d:path('M124 46c-6 10-6 18 2 26')}`);
  ON('.pg-str', 'pgStr 1.2s ease-in-out infinite'); ON('.pg-str2', 'pgStr2 1.2s ease-in-out infinite');

}

/* ── 제기: 엽전이 아래, 깃털이 위 — 올라갈 땐 깃털이 오므라들고, 내려올 땐 바람을 받아 활짝 펴지며 나풀거림 ── */
{

  KF('jg2J', `0%{transform:translateY(0) rotate(0deg) scale(1.06,.92);animation-timing-function:cubic-bezier(.15,.75,.35,1)}6%{transform:translateY(-6px) rotate(-3deg) scale(.97,1.04);animation-timing-function:cubic-bezier(.2,.7,.4,1)}40%{transform:translateY(-36px) rotate(5deg);animation-timing-function:ease-in-out}54%{transform:translateY(-40px) rotate(182deg);animation-timing-function:ease-in-out}62%{transform:translateY(-36px) rotate(176deg);animation-timing-function:cubic-bezier(.55,0,.85,.5)}80%{transform:translateY(-22px) rotate(184deg);animation-timing-function:ease-in}93%{transform:translateY(0) rotate(348deg)}97%{transform:translateY(1px) rotate(360deg) scale(1.06,.92)}100%{transform:translateY(0) rotate(360deg) scale(1.06,.92)}`);
  KF('jg2Plume', `0%{transform:scale(1.2,.84)}8%{transform:scale(.62,.9)}30%{transform:scale(.7,.94)}46%{transform:scale(1,1)}56%{transform:scale(1.18,1.05)}68%{transform:scale(.78,1.06)}80%{transform:scale(.74,1.04)}90%{transform:scale(1.1,1)}96%,100%{transform:scale(1.2,.84)}`);

/* ── 연날리기: 바람 선 효과 뺌 ── */

{
  const puff = (x, y, dx, dy, r, d) => `<g class="tj2-d" style="--dx:${dx}px;--dy:${dy}px;--dd:${d}s"><circle cx="${x}" cy="${y}" r="${r}" fill="#D9C7A6"/><circle cx="${x+r*.7}" cy="${y-r*.3}" r="${r*.7}" fill="#E3D5BA"/><circle cx="${x-r*.6}" cy="${y+r*.1}" r="${r*.6}" fill="#E8DCC6"/></g>`;

PPL.rules.push('.yr-obj-in:is(:hover,:focus-visible) .jl-ropes{transform:scaleY(.5)}');

/* ── 강강술래: 민속화 풍 보름달 — 은은한 달무리, 옅은 얼룩, 앞을 지나는 구름 ── */
{

    <g transform="translate(46 58)"><path d="M0 8c-4 0-6-3-4-6c1-2 4-3 6-2c1-4 6-6 10-4c3-4 10-4 13 0c4-2 9 0 10 4c4 0 6 3 5 6c-1 2-3 3-5 2H0z" style="fill:var(--bg)" stroke="#D8C7A2" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M12 4c0-3 3-4 5-3s1 4-1 4M24 3c1-2 4-2 5 0" stroke="#D8C7A2" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M-6 9.6H60" stroke="#D8C7A2" stroke-width="1.2" stroke-linecap="round"/></g>`;
  ART.ganggang = ART.ganggang.replace(/^<circle cx="80" cy="44" r="32"[\s\S]*?<circle cx="88" cy="32" r="2.4"[^>]*\/>/, moon);

/* ── 팽이: 띠 무늬를 몸통 단면(타원)에 정확히 맞춤 ── */
{
  const wAt = y => y <= 72 ? 32 : 32*(126 - y)/54, ry = w => w*9/32;
  const band = (y1, y2, fill) => { const w1 = wAt(y1), w2 = wAt(y2);
    return `<path d="M${f(74-w1)} ${y1}A${f(w1)} ${f(ry(w1))} 0 0 0 ${f(74+w1)} ${y1}L${f(74+w2)} ${y2}A${f(w2)} ${f(ry(w2))} 0 0 1 ${f(74-w2)} ${y2}Z" fill="${fill}"/>`; };
  ART.paengi = ART.paengi
    .replace(/<path d="M42 72Q74 81 106 72"[^>]*\/><path d="M42 69Q74 78 106 69"[^>]*\/>/, band(65.5, 71.5, DH))
    .replace(/<path d="M56.5 96Q74 101 91.5 96"[^>]*\/>/, band(93, 98.5, JJ))
    .replace(/<path d="M64.5 110Q74 113 83.5 110"[^>]*\/>/, band(108, 111, CJ));
}

/* ═════ 손 다시 그리기 ═════ */
const HSK = PPL.SK, HSD = '#E2B48F', HLN = '#C99A74';
const hol = `stroke="${HLN}" stroke-width=".9" stroke-linejoin="round"`;

/* 손 그리기: 실루엣(SKIN 조각)을 먼저 테두리색으로 두껍게 깔고 그 위에 살색을 덮어, 바깥 윤곽만 남기고 손가락·손바닥이 겹치는 곳의 선은 없앰 */
const SIL = (pieces, detail='') => pieces.map(p => p.split('fill="SKIN"').join(`fill="${HLN}" stroke="${HLN}" stroke-width="1.8" stroke-linejoin="round"`)).join('')
  + pieces.map(p => p.split('fill="SKIN"').join(`fill="${HSK}"`)).join('') + detail;

/* ── 공기놀이: 단순한 손 — 손바닥 · 손등 · 주먹 (선 없이 한 덩어리) ── */
{

  const palm = `<path d="M-30 -6C-20 -7 -12 -7 -2 -6.4C8 -6 18 -7 26 -10.4C31 -12.6 35 -11.2 33.4 -7.6C31 -2.6 22 1.6 10 3.4C-2 5.4 -16 6.4 -30 6.6Z" fill="${HSK}"/>
    <path d="M-16 -6.6C-15 -11.4 -11 -14 -6.6 -14.2C-3.6 -14.2 -3 -11.6 -5.4 -10C-8 -8.4 -9.4 -7.6 -10 -6.4Z" fill="${HSK}"/>${sh('M-30 3.6C-16 3.4 -2 2.4 10 .4C20 -1.4 27 -4 31.6 -7.4C33 -4 28 -.8 20 1.6C8 4.6 -14 6.6 -30 6.6Z')}`;
  const back = `<path d="M-30 -5.6C-20 -6.6 -10 -9 2 -9.4C14 -9.6 26 -8 32 -6.2C36 -5 36 -1.8 32.6 -1.2C24 .2 12 1.4 0 3.6C-10 5.4 -20 6.4 -30 6.6Z" fill="${HSK}"/>${sh('M-30 3.8C-18 3.4 -6 2 6 .6C16 -.6 26 -1.6 34 -2.8C34 -1.6 33.6 -1.2 32.6 -1.2C24 .2 12 1.4 0 3.6C-10 5.4 -20 6.4 -30 6.6Z')}`;
  const fist = `<path d="M-30 -6.4C-20 -7.6 -10 -11.6 2 -12C14 -12.4 21 -6.6 21 0C21 6.6 15 10 4 10C-8 10 -20 7.6 -30 6.8Z" fill="${HSK}"/>${sh('M-30 4C-18 5.4 -6 7 4 7C13 7 18 4.6 20.6 1.4C20.2 7 14.6 10 4 10C-8 10 -20 7.6 -30 6.8Z')}`;
  ART.gonggi = ART.gonggi.replace(/<g class="gk-palm">[\s\S]*?<\/g><g class="gk-back" opacity="0">[\s\S]*?<\/g><g class="gk-fist" opacity="0">[\s\S]*?<\/g>/,
    `<g class="gk-palm">${palm}</g><g class="gk-back" opacity="0">${back}</g><g class="gk-fist" opacity="0">${fist}</g>`);
}

/* ── 땅따먹기: 위에서 본 손 — 엄지에 검지를 걸었다가 탁 튕김 ── */
{
  const hand = `<rect x="-8.6" y="25" width="17.2" height="20" rx="2" fill="${CG}"/>
    <rect x="-6.4" y="10" width="12.8" height="17" rx="5" fill="${HSK}"/>

    <rect x="-10" y="-8" width="20" height="25" rx="9" fill="${HSK}"/>

  KF('tt2Ix', '0%,29%{transform:scaleY(.35)}31%{transform:scaleY(1.08)}34%,100%{transform:scaleY(1)}');

  PPL.rules.push('.tt2-ix{transform-box:view-box;transform-origin:2.8px -1px}');
}

/* ── 실뜨기: 내 손(아래)에 걸린 실을 맞은편 사람 손(위)이 집어 당겨 가져가고, 다시 내 손이 받아 옴 ── */
{
  const T = 5.2, SC = 1.15;
  const handUp = (sleeve) => `<rect x="-12" y="-1" width="24" height="16" fill="${sleeve}"/><rect x="-12" y="-4" width="24" height="4" fill="${PA}"/>
    <rect x="-11.5" y="-54" width="22" height="52" rx="11" fill="${HSK}"/>
    <g transform="translate(8 -13) rotate(35)"><rect x="-3" y="-16" width="6" height="19" rx="3" fill="${HSK}"/></g>
    <path d="M-11.5 -14C-11 -6 -8 -2 -2 -2H6C1 -4 -6 -8 -11.5 -14Z" fill="${HSD}" opacity=".45"/>`;
  const TIP = [5*SC, -52*SC], TH = [18.6*SC, -25*SC];
  // 손 위치(손목) — 위쪽 손은 위아래로 뒤집힌 그림
  const myL = {0:[30,134],15:[30,134],28:[30,134],40:[30,138],50:[30,168],62:[40,168],75:[66-TIP[0],52-TIP[1]],84:[44,118],88:[30,134],100:[30,134]};
  const thL = {0:[52,-20],15:[52,-20],28:[67-TIP[0],86+TIP[1]],40:[46,20],50:[34,8],62:[34,8],75:[34,8],84:[36,-14],88:[44,-16],100:[52,-20]};
  const mirror = (o) => Object.fromEntries(Object.entries(o).map(([k,[x,y]])=>[k,[160-x,y]]));
  const myR = mirror(myL), thR = mirror(thL);

const srDieKF = (sx, sy, rot0, bounces) => { let fr = `0%{opacity:0;transform:translate(${sx}px,${sy}px) rotate(${rot0}deg) scale(1.2)}`;
  const END = 46, N = 46;
  for(let k = 0; k <= N; k++){ const u = k/N, e = 1 - Math.pow(1 - u, 2.2), b = Math.abs(Math.sin(Math.PI*bounces*Math.pow(u, .85))), damp = Math.pow(1 - u, 1.6);
    const sc = 1 + .22*b*damp, sq = 1 - .1*(1 - b)*damp;
    fr += `${f(u*END)}%{opacity:${k ? 1 : 0};transform:translate(${f(sx*(1 - e))}px,${f(sy*(1 - e))}px) rotate(${f(rot0*(1 - e))}deg) scale(${f(sc/sq*.5 + sc*.5)},${f(sc*sq)})}`; }
  return fr + `86%{opacity:1;transform:none}93%,100%{opacity:0;transform:none}`; };

/* ── 승경도 윤목: 오각기둥이 길이 방향과 수직으로 데굴데굴 굴러와 한 면을 바닥에 대고 멈춤 (면마다 눈금 1~5개) ── */
{
  const T = 3.6, r = 9, AL = 55*Math.PI/180, SA = Math.sin(AL), CA = Math.cos(AL), D = Math.PI/180;
  const LI = (()=>{ const l = [.35, .94], m = Math.hypot(...l); return l.map(q => q/m); })();
  const thF = 235, R = 300;           // 멈추면 한 면이 바닥에 닿고, 눈금 3개 면이 정면 위로 보임
  const state = (u) => { // u: 0~1 (한 바퀴) — 굴러 멈춘 뒤 말이 움직일 시간을 둠
    let th = thF, yc = 0, zb = 0, op = 1;
    if(u < .05){ const q = u/.05; th = thF + R; yc = -r*R*D; zb = 16*(1 - q*q); op = q; }
    else if(u < .38){ const q = (u - .05)/.33, e = 1 - Math.pow(1 - q, 2.2); th = thF + R*(1 - e); yc = -r*R*D*(1 - e); zb = Math.abs(Math.sin(q*Math.PI*2.4))*Math.pow(1 - q, 2)*5; }
    else if(u < .46){ const q = (u - .38)/.08; th = thF + 7*Math.sin(q*Math.PI*1.5)*(1 - q); }
    else if(u < .9){ }
    else if(u < .95){ op = 1 - (u - .9)/.05; }
    else { op = 0; th = thF + R; yc = -r*R*D; zb = 16; }
    return {th, yc, zb, op}; };
  const faces = (st) => { const out = []; const cz = r*Math.cos(36*D) + st.zb;
    for(let k = 0; k < 5; k++){ const a1 = (st.th + k*72)*D, a2 = (st.th + (k+1)*72)*D, am = (st.th + k*72 + 36)*D;
      const p1 = [st.yc + r*Math.cos(a1), cz + r*Math.sin(a1)], p2 = [st.yc + r*Math.cos(a2), cz + r*Math.sin(a2)];
      const s1 = p1[0]*SA - p1[1]*CA, s2 = p2[0]*SA - p2[1]*CA, n = [Math.cos(am), Math.sin(am)];
      const vis = n[0]*CA + n[1]*SA > .02, lit = Math.max(0, n[0]*LI[0] + n[1]*LI[1]);
      out.push({mid:(s1+s2)/2, h:Math.max(.01, Math.abs(s1 - s2)), vis, lit}); }
    return out; };
  const col = (lit) => { const k = .66 + .34*lit; return `rgb(${Math.round(235*k)},${Math.round(203*k)},${Math.round(152*k)})`; };
  const N = 72, fr = [[],[],[],[],[]], frc = [[],[],[],[],[]], frs = [];
  for(let i = 0; i <= N; i++){ const u = i/N, st = state(u), F = faces(st), pc = f(u*100);
    F.forEach((q, k) => { fr[k].push(`${pc}%{transform:translateY(${f(q.mid)}px) scaleY(${f(q.h/10)});opacity:${q.vis ? f(st.op) : 0}}`); frc[k].push(`${pc}%{fill:${col(q.lit)}}`); });
    frs.push(`${pc}%{transform:translateY(${f(st.yc*SA)}px) scale(${f(1 - st.zb*.02)});opacity:${f(st.op*(1 - st.zb*.03))}}`); }
  for(let k = 0; k < 5; k++){ KF(`ymF${k}`, fr[k].join('')); KF(`ymC${k}`, frc[k].join('')); ON(`.ym-f${k}`, `ymF${k} ${T}s linear infinite`); ON(`.ym-c${k}`, `ymC${k} ${T}s linear infinite`); }
  KF('ymSh', frs.join('')); ON('.ym-sh', `ymSh ${T}s linear infinite`);
  PPL.rules.push('.ym-f0,.ym-f1,.ym-f2,.ym-f3,.ym-f4,.ym-sh{transform-box:view-box;transform-origin:0 0}');
  const rest = faces(state(.6));
  const band = (k) => { const q = rest[k], marks = [...Array(k+1)].map((_, j) => -6*k/2 + j*6 - 8);
    return `<g class="ym-f${k}" style="transform:translateY(${f(q.mid)}px) scaleY(${f(q.h/10)});opacity:${q.vis ? 1 : 0}"><rect class="ym-c${k}" x="-44" y="-5" width="86" height="10" rx="1.6" style="fill:${col(q.lit)}"/>
      <path d="M-44 -5h86" stroke="#7E4F28" stroke-width=".6" opacity=".35"/>${marks.map(x => `<path d="M${x} -3.4v6.8" stroke="#7E4F28" stroke-width="2.2" stroke-linecap="round"/>`).join('')}</g>`; };
  const yun = `<g class="ym-sh" style="transform:translateY(0px)"><ellipse cx="-1" cy="8" rx="46" ry="3.6" fill="#3A332C" opacity=".14"/></g>` + [0,1,2,3,4].map(band).join('');

  // 나온 수: 멈췄을 때 가장 위를 향한 면의 눈금 수 → 그만큼 말이 칸을 따라 깡충 이동
  const top = (()=>{ let best = -1, k0 = 0; for(let k = 0; k < 5; k++){ const am = (thF + k*72 + 36)*D, up = Math.cos(am)*CA + Math.sin(am)*SA; if(up > best){ best = up; k0 = k; } } return k0 + 1; })();
  const CW = 29.5, RH = 20.5, path = [[0,0]]; { let c = 1, row = 1; for(let i = 0; i < top; i++){ if(c < 3) c++; else row++; path.push([(c-1)*CW, (row-1)*RH]); } }
  let pk = `0%,49%{transform:translate(0px,0px)}`; const t0 = 50, step = 7;
  path.slice(1).forEach(([x, y], i) => { const [px, py] = path[i], a = t0 + i*step;
    pk += `${f(a + step*.5)}%{transform:translate(${f((px+x)/2)}px,${f((py+y)/2 - 9)}px) scale(1.12)}${f(a + step*.92)}%{transform:translate(${f(x)}px,${f(y)}px) scale(1.12,.86)}${f(a + step)}%{transform:translate(${f(x)}px,${f(y)}px)}`; });
  const [lx, ly] = path[path.length - 1];
  pk += `90%{transform:translate(${f(lx)}px,${f(ly)}px);opacity:1}95%{transform:translate(${f(lx)}px,${f(ly)}px);opacity:0}96%{transform:translate(0px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:1}`;
  KF('sgPc2', pk); ON('.sg-pc', `sgPc2 ${T}s ease-in-out infinite`);
  // 도착한 칸 반짝
  const [cx, cy] = [50.5 + lx, 57.5 + ly];
  KF('sgCell', `0%,${f(t0 + step*(path.length-1) - 1)}%{opacity:0}${f(t0 + step*(path.length-1) + 2)}%{opacity:.45}90%{opacity:.3}95%,100%{opacity:0}`); ON('.sg-cell', `sgCell ${T}s linear infinite`);
  PPL.rules.push('.sg-pc{transform-box:fill-box;transform-origin:50% 100%}.sg-cell{opacity:0}');
  ART.seung = ART.seung.replace('<g class="sg-pc">', `<rect class="sg-cell" x="${f(cx)}" y="${f(cy)}" width="29.5" height="20.5" fill="${CJ}"/><g class="sg-pc">`);
  ART.seung = ART.seung.replace(/<ellipse cx="92" cy="144" rx="42" ry="4"[^>]*\/>\s*<g class="yun">[\s\S]*$/, `<g transform="translate(94 134) rotate(-14)">${yun}</g>`);
}

const $ = (s, r=document) => r.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TOUCH = matchMedia('(pointer: coarse)').matches || (matchMedia('(hover: none)').matches && 'ontouchstart' in window);
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const store = {
  get(k, d){ try{ const v = localStorage.getItem('nolimadang-'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('nolimadang-'+k, JSON.stringify(v)); }catch(e){} }
};

/* ═════════ 소리 (모두 합성) ═════════ */
const Snd = {
  ctx:null, on:true, master:null, nb:null,
  ensure(){
    if(!this.ctx){ try{ const AC = window.AudioContext||window.webkitAudioContext; this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .7; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; this.nb = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = this.nb.getChannelData(0); for(let i=0;i<len;i++) d[i] = Math.random()*2-1; }catch(e){ this.ctx = null; } }
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  now(){ return this.ctx ? this.ctx.currentTime : performance.now()/1000; },
  tone(t, f0, f1, dur, type, vol){ const c=this.ctx, o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(f1,20),t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+.02); },
  noise(t, dur, ftype, freq, q, vol){ const c=this.ctx, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=this.nb; f.type=ftype; f.frequency.value=freq; f.Q.value=q; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur); s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()*.5); s.stop(t+dur+.02); },
  play(kind, when){
    if(!this.on) return; const c = this.ensure(); if(!c) return; const t = when || c.currentTime;
    switch(kind){
      case 'deong': this.tone(t,120,58,.38,'sine',.9); this.noise(t,.06,'highpass',2600,.7,.35); break;
      case 'ttak': this.noise(t,.07,'bandpass',3200,1.4,.8); this.tone(t,1100,700,.05,'triangle',.18); break;
      case 'kung': this.tone(t,95,55,.3,'sine',.45); break;
      case 'tock': this.tone(t,640,420,.07,'triangle',.4); this.noise(t,.03,'bandpass',1800,2,.25); break;
      case 'clack': [0,.05,.11,.16].forEach((d,i)=>{ this.tone(t+d,700-i*40,460,.06,'triangle',.28); }); break;
      case 'whoosh': this.noise(t,.22,'bandpass',900,.8,.35); break;
      case 'thud': this.tone(t,160,60,.18,'sine',.6); this.noise(t,.08,'lowpass',500,.7,.4); break;
      case 'ding': this.tone(t,880,880,.25,'sine',.25); this.tone(t+.09,1320,1320,.35,'sine',.22); break;
      case 'fail': this.tone(t,300,140,.4,'triangle',.25); break;
      case 'splash': this.noise(t,.25,'highpass',1200,.5,.35); break;
      case 'win': [660,880,1100,1320].forEach((f,i)=>this.tone(t+i*.09,f,f,.22,'sine',.22)); break;
      case 'rope': this.noise(t,.09,'lowpass',420,.9,.45); this.tone(t,110,80,.08,'sine',.25); break;
      case 'snap': this.noise(t,.12,'highpass',2600,1,.5); this.tone(t,900,200,.18,'triangle',.2); break;
      case 'bell': this.tone(t,1240,1240,.6,'sine',.25); this.tone(t,1860,1860,.45,'sine',.12); this.tone(t+.12,1240,1240,.5,'sine',.15); break;
      case 'hit': this.tone(t,220,90,.14,'sine',.55); this.noise(t,.06,'bandpass',900,1,.45); break;
    }
  }
};

/* ═════════ 기울어짐 (시작 화면·마당·설명 공통) ═════════ */
const Tilt = {
  items:[], px:innerWidth/2, py:innerHeight*.45, raf:0,
  add(el, shade, max, fall){ const o = {el, shade, max, fall, rx:0, ry:0, sx:0, sy:0, cx:0, cy:0}; this.items.push(o); return o; },
  clear(){ this.items = []; },
  measure(){ this.items.forEach(o => { const r = o.el.getBoundingClientRect(); o.cx = r.left + r.width/2; o.cy = r.top + r.height/2; }); },
  tick(){
    for(const o of this.items){
      if(!o.el.isConnected) continue;
      const dx = this.px - o.cx, dy = this.py - o.cy, d = Math.hypot(dx,dy) || 1;
      const amt = RM ? 0 : o.max * (0.28 + 0.72*Math.exp(-d/o.fall));
      const tx = -dy/d*amt, ty = dx/d*amt;
      o.rx = lerp(o.rx, tx, .12); o.ry = lerp(o.ry, ty, .12);
      const key = `${o.rx.toFixed(1)},${o.ry.toFixed(1)}`; // 거의 안 변했으면 건너뜀
      if(key !== o.key){ o.key = key; o.el.style.transform = `rotateX(${o.rx.toFixed(1)}deg) rotateY(${o.ry.toFixed(1)}deg)`; }
      if(o.shade && o.shade.offsetParent){ const s = amt/o.max; o.sx = lerp(o.sx, -dx/d*14*s, .12); o.sy = lerp(o.sy, -dy/d*6*s, .12); o.shade.style.transform = `translate(${o.sx.toFixed(1)}px,${o.sy.toFixed(1)}px)`; }
    }
    this.raf = requestAnimationFrame(() => this.tick());
  }
};
window.addEventListener('pointermove', e => { Tilt.px = e.clientX; Tilt.py = e.clientY; }, {passive:true});
window.addEventListener('scroll', () => Tilt.measure(), {passive:true});
window.addEventListener('resize', () => { if(current==='intro') layoutIntro(); if(current==='yard') layoutYard(); Tilt.measure(); });
Tilt.tick();

const field = $('#introField');
let introPieces = [];
function buildIntro(){
  field.innerHTML = ''; introPieces = [];
  GAMES.forEach((g,i) => {
    const el = document.createElement('div'); el.className = 'piece';
    el.innerHTML = `<div class="bob" style="--d:${(5+(i%5)*.9).toFixed(1)}s;--dl:-${((i*0.77)%6).toFixed(2)}s"><div class="shade"></div><div class="tilt">${svgOf(g.id)}</div></div>`;
    field.appendChild(el); introPieces.push(el);
  });
  layoutIntro();
}
function layoutIntro(){
  const W = innerWidth, H = innerHeight, portrait = H > W*1.1;
  const cols = portrait ? 4 : (W < 1000 ? 6 : 7), rows = portrait ? 9 : 4;
  const cw = W/cols, ch = H/rows, R = rng(7);
  const cells = [];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const cx = (c+.5)/cols, cy = (r+.5)/rows;
    const inCenter = portrait ? (cy > .33 && cy < .67) : (Math.abs(cx-.5) < (cols>=7?.25:.22) && cy > .25 && cy < .75);
    if(!inCenter) cells.push([c,r]);
  }
  // 남는 칸은 가운데 제목 쪽에서 비운다 (모서리가 비어 보이지 않게)
  const n = introPieces.length;
  cells.sort((a,b) => Math.hypot((b[0]+.5)/cols-.5, ((b[1]+.5)/rows-.5)*H/W) - Math.hypot((a[0]+.5)/cols-.5, ((a[1]+.5)/rows-.5)*H/W));
  const use = cells.slice(0, n);
  for(let i=use.length-1;i>0;i--){ const j = Math.floor(R()*(i+1)); [use[i],use[j]] = [use[j],use[i]]; }
  const size = Math.round(clamp(Math.min(cw,ch)*.78, 54, 150));
  const pts = use.map(([c,r]) => ({x:(c+.5)*cw + (R()-.5)*cw*.16, y:(r+.5)*ch + (R()-.5)*ch*.14}));
  // 서로 너무 가까운 것끼리 살짝 밀어내기
  const minD = size*1.25, pad = size*.55;
  for(let it=0; it<40; it++) for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const dx = pts[j].x - pts[i].x, dy = pts[j].y - pts[i].y, d = Math.hypot(dx,dy) || 1;
    if(d < minD){ const m = (minD - d)/2, ux = dx/d, uy = dy/d; pts[i].x -= ux*m; pts[i].y -= uy*m; pts[j].x += ux*m; pts[j].y += uy*m; }
  }
  // 제목 글자 위로는 올라오지 않게
  const tb = document.querySelector('.intro-title')?.getBoundingClientRect();
  if(tb && tb.width) pts.forEach(p => { const m = size*.45, inX = p.x > tb.left - m && p.x < tb.right + m, inY = p.y > tb.top - m && p.y < tb.bottom + m;
    if(inX && inY){ const up = p.y < (tb.top + tb.bottom)/2; const dxL = p.x - (tb.left - m), dxR = (tb.right + m) - p.x, dy = up ? p.y - (tb.top - m) : (tb.bottom + m) - p.y;
      if(Math.min(dxL, dxR) < dy && !portrait){ p.x = dxL < dxR ? tb.left - m : tb.right + m; } else p.y = up ? tb.top - m : tb.bottom + m; } });
  introPieces.forEach((el,i) => {
    const p = pts[i % pts.length], x = clamp(p.x, pad, W - pad), y = clamp(p.y, pad, H - pad);
    el.style.setProperty('--x', x+'px'); el.style.setProperty('--y', y+'px');
    el.style.setProperty('--s', size+'px'); el.style.setProperty('--r', ((R()-.5)*30).toFixed(1)+'deg');
  });
  requestAnimationFrame(() => Tilt.measure());
}

  const S = Math.min(W, H)*.84, ox = (W-S)/2 + (W > 900 ? W*.035 : 0), oy = (H-S)/2 + 30;
  const P = (u,v) => [ox+u*S, oy+v*S];
  let pts = [];
  for(let k=0;k<=5;k++){ pts.push(P(1,1-k/5),P(1-k/5,0),P(0,k/5),P(k/5,1)); }

function makeCanvas(host){
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  host.appendChild(c);
  const o = { c, ctx, W:0, H:0, dpr:1, onResize:null };
  const fit = () => { const r = host.getBoundingClientRect(); o.dpr = Math.min(window.devicePixelRatio||1, 3); o.W = Math.max(1, r.width); o.H = Math.max(1, r.height);
    c.width = Math.round(o.W*o.dpr); c.height = Math.round(o.H*o.dpr); c.style.width = o.W+'px'; c.style.height = o.H+'px'; ctx.setTransform(o.dpr,0,0,o.dpr,0,0); if(o.onResize) o.onResize(); };
  fit();
  const ro = new ResizeObserver(fit); ro.observe(host);
  o.destroy = () => { ro.disconnect(); c.remove(); };
  return o;
}
function loop(fn){
  let last = performance.now(), id = 0, alive = true;
  const f = t => { if(!alive) return; const dt = Math.min(.05, (t-last)/1000); last = t; fn(dt, t/1000); id = requestAnimationFrame(f); };
  id = requestAnimationFrame(f);
  return () => { alive = false; cancelAnimationFrame(id); };
}

  const TEAM_L = [{top:'#C8473A', bot:'#F0C24B', rib:'#2E4A6B'}, {top:'#5C8C5A', bot:'#2E4A6B', girl:false, rib:'#C8473A', vest:'#2E4A6B'}, {top:'#E2B23C', bot:'#C8473A', rib:'#3F7F6E', git:'#C8473A'}, {top:'#E9A0B4', bot:'#3F7F6E', girl:false, rib:'#C8473A'}];
  const TEAM_R = [{top:'#2E4A6B', bot:'#9E3329', girl:false, rib:'#E2B23C'}, {top:'#4E78A8', bot:'#3F7F6E', rib:'#E2B23C'}, {top:'#8A6FA8', bot:'#2E4A6B', girl:false, rib:'#E9A0B4', vest:'#5A4A7A'}, {top:'#3F7F6E', bot:'#4E78A8', rib:'#C8473A', git:'#2E4A6B'}];
  const figsL = TEAM_L.map(o => RIG.make(Object.assign({yaw:YAW, mouth:'grit'}, o))), figsR = TEAM_R.map(o => RIG.make(Object.assign({yaw:YAW, mouth:'grit'}, o)));
  const armCache = new Map();
  const arms = (b, ty) => { const k = Math.round(b*2) + ':' + Math.round(ty*2); let v = armCache.get(k);
    if(!v){ v = [RIG.solveArm(YAW, 'n', b, ty, FA).ua, RIG.solveArm(YAW, 'f', b, ty, FA).ua]; armCache.set(k, v); } return v; };
  function person(g, F, x, y, S, flip, b, ty, phase, effort, girl){
    const step = Math.sin(phase)*(2 + effort*5), legs = {thn:LEGS.thn - step, shn:LEGS.shn + Math.max(0, step)*.8, thf:LEGS.thf + step*.6, shf:LEGS.shf};
    const dy = RIG.ground(legs), [un, uf] = arms(b, ty + (-dy - RIG.ground(LEGS)));
    F.draw(g, x, y, S, Object.assign({r:[['translate',[0, dy]]], b, uan:un, fan:FA, uaf:uf, faf:FA, h:6 + effort*6, br:24 + effort*14, gr:20 + effort*10, sk: girl ? -b*.8 : 0}, legs), {flip});
  }
  function draw(time){
    const W = cv.W, H = cv.H, u = Math.min(W/900, H/600); if(!bg) buildBg(); ctx.drawImage(bg, 0, 0, W, H);
    const gy = H*.78, cx = W/2, span = W*.2, off = -pos*span, sx = shake ? (Math.random()-.5)*4 : 0;
    // 바닥 선: 가운데 선, 양쪽 승리선
    ctx.strokeStyle = 'rgba(255,252,244,.95)'; ctx.lineWidth = 4; ctx.setLineDash([10,8]); ctx.beginPath(); ctx.moveTo(cx, gy - 70*u); ctx.lineTo(cx, gy + 40*u); ctx.stroke(); ctx.setLineDash([]);
    [[-1,'#C8473A','이기는 선'],[1,'#2E4A6B','지는 선']].forEach(([s,c,l]) => { const x = cx + s*span; ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, gy - 60*u); ctx.lineTo(x, gy + 40*u); ctx.stroke();
      ctx.fillStyle = c; ctx.font = `bold ${Math.round(13*Math.max(.9,u))}px ${FU}`; ctx.textAlign = 'center'; ctx.fillText(l, x, gy + 58*u); });
    // 줄
    const ry = gy - 52*u, rope0 = 20, rope1 = W - 20;
    const effort = Math.min(1, myPow/4), aEff = Math.min(1, aiPow/(aiBase()*1.9));
    ctx.strokeStyle = '#B88E36'; ctx.lineWidth = 12*u; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(rope0, ry + 8*u); ctx.quadraticCurveTo(cx + off, ry + 4*u, rope1, ry + 8*u); ctx.stroke();
    ctx.strokeStyle = '#E0BE6A'; ctx.lineWidth = 12*u; ctx.setLineDash([6,8]); ctx.lineDashOffset = -off; ctx.beginPath(); ctx.moveTo(rope0, ry + 8*u); ctx.quadraticCurveTo(cx + off, ry + 4*u, rope1, ry + 8*u); ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;
    // 가운데 표시 천
    const fx = cx + off + sx; ctx.fillStyle = '#9E3329'; ctx.fillRect(fx - 7*u, ry - 2*u, 14*u, 16*u); ctx.fillStyle = '#C8473A'; ctx.beginPath(); ctx.moveTo(fx, ry + 12*u); ctx.lineTo(fx - 14*u, ry + 52*u); ctx.lineTo(fx, ry + 42*u); ctx.lineTo(fx + 14*u, ry + 52*u); ctx.fill();
    // 사람들
    const S = 1.5*u, ty = -(gy - (ry + 6*u))/S;
    for(let i=3;i>=0;i--){ const x = cx + off - span*1.3 - i*62*u + sx; person(ctx, figsL[i], x, gy, S, false, -(20 + effort*12 + Math.sin(time*3 + i)*1.5), ty, time*(6 + effort*8) + i*1.3, effort, TEAM_L[i].girl !== false); }
    for(let i=3;i>=0;i--){ const x = cx + off + span*1.3 + i*62*u; person(ctx, figsR[i], x, gy, S, true, -(20 + aEff*12 + Math.sin(time*2.6 + i)*1.5), ty, time*(5 + aEff*8) + i*1.1, aEff, TEAM_R[i].girl !== false); }
    dust.forEach(d => { ctx.globalAlpha = 1 - d.t/.6; ctx.fillStyle = '#E8DAB8'; ctx.beginPath(); ctx.arc(cx + off - span*1.3 - (d.x % (W*.18)) - d.t*30, gy + 2 - d.t*16, 6 + d.t*14, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1;
    // 힘 막대 (내 힘 vs 상대 힘)
    const bw = Math.min(W*.6, 460), bx = cx - bw/2, by = 18 + 0;
    ctx.fillStyle = 'rgba(42,40,38,.45)'; rrect(ctx, bx - 3, by - 3, bw + 6, 20, 10); ctx.fill();
    const tot = myPow*3.4 + aiPow + .01, share = clamp(myPow*3.4/tot, 0, 1);
    ctx.fillStyle = '#C8473A'; rrect(ctx, bx, by, bw*share, 14, 7); ctx.fill(); ctx.fillStyle = '#2E4A6B'; rrect(ctx, bx + bw*share, by, bw*(1-share), 14, 7); ctx.fill();
    ctx.fillStyle = '#FBF6EA'; ctx.font = `bold 11px ${FU}`; ctx.textAlign = 'left'; ctx.fillText('우리 편 힘', bx + 8, by + 11); ctx.textAlign = 'right'; ctx.fillText('상대 힘', bx + bw - 8, by + 11);
    // 박자 북
    const ph = (beatT % BEAT)/BEAT, pulse = ph < .16 || ph > .84;
    ctx.fillStyle = pulse ? '#C8473A' : 'rgba(200,71,58,.3)'; ctx.beginPath(); ctx.arc(cx, by + 48, 12 + (pulse ? 3 : 0), 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(42,40,38,.7)'; ctx.font = `12px ${FU}`; ctx.textAlign = 'center'; ctx.fillText('북이 울릴 때 누르면 더 세게!', cx, by + 78);
    pops.forEach(p => { ctx.globalAlpha = Math.max(0, 1 - p.t/.8); ctx.font = `${Math.round(24*Math.max(.8,u))}px ${FD}`; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.85)'; const x = W*p.x, y = H*.4 - p.t*30; ctx.strokeText(p.text, x, y); ctx.fillStyle = p.c; ctx.fillText(p.text, x, y); }); ctx.globalAlpha = 1;
    if(st === 'play' && clicks < 3){ ctx.font = `bold 15px ${FU}`; ctx.fillStyle = '#2A2826'; ctx.fillText(TOUCH ? '화면을 마구 톡톡 두드려요!' : '마우스를 마구 클릭해요!', cx, H*.32); }
  }
  const stop = loop((dt, t) => { update(dt); draw(t); });
  cv.onResize = () => { bg = null; };
  const pd = e => { if(e.target.closest('.ov')) return; pull(); };
  const kd = e => { if(e.code === 'Space' && !e.repeat && !stage.querySelector('.ov')){ e.preventDefault(); pull(); } };
  stage.addEventListener('pointerdown', pd); window.addEventListener('keydown', kd);
  hudUp();
  api.overlay({title:'줄다리기', body:'마우스를 빠르게 계속 클릭해 줄을 우리 편으로 당겨요 가운데 빨간 천이 왼쪽 이기는 선을 넘으면 승리! 북이 울릴 때 맞춰 누르면 힘이 더 세지고, 상대가 힘을 모으면 더 빨리 눌러 버텨요', pics:ctrlFor('jul'),
    buttons:[{label:'시작하기', primary:true, onClick:() => { api.hideOverlay(); reset(1); }}]});
  return { _state(){ return ({st, pos, myPow, aiPow, round}); }, _pump(){ return typeof pump==='function' ? pump() : null; }, destroy(){ stop(); cv.destroy(); stage.removeEventListener('pointerdown', pd); window.removeEventListener('keydown', kd); } };
};
</script>
